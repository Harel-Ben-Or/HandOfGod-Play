<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hand of God</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #101018;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas {
      position: fixed; left: 0; top: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #101018; outline: none; touch-action: none;
    }
    /* Never shown; its padding resolves env(safe-area-inset-*) to pixels for the game's safe area. */
    #sa-probe {
      position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    /* Loading screen (user, 2026-10-14): the title art (the user's own, made with Gemini from option G: the world
       from above, the hand from the clouds over the burning ring, our monsters in front, the HAND OF GOD logo painted
       in; its painted TAP text was painted out so the live one can flicker), embers rising, a gold bar; when the game
       is ready, a flickering TAP ANYWHERE TO START, and the tap opens the game (it also unlocks sound and full screen,
       which browsers only allow after a tap). ?tap=0 skips the tap.
       The whole picture always shows (its logo on top, the monsters along the bottom): on screens wider than 16:9 it
       fits the height and a blurred, darkened copy fills the strips at the sides.
       #ld-logo / #ld-title are a logo layer and a text title for art without its own logo (unused now). */
    @font-face { font-family: "HOGTitle"; src: url("LilitaOne-Regular.ttf") format("truetype"); font-display: swap; }
    #loader {
      position: fixed; inset: 0; z-index: 4; overflow: hidden; background: #0c0b12; color: #e9e4d8;
      font: 15px system-ui, sans-serif; transition: opacity .7s ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #ld-art {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      transform-origin: 50% 18%;
      animation: ld-drift 40s ease-in-out infinite alternate;
    }
    @keyframes ld-drift { from { transform: scale(1.01); } to { transform: scale(1.06) translate(-.6%, 0); } }
    #ld-logo {
      position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + .4vh); transform: translateX(-50%);
      height: max(15vh, 8.4vw); width: auto; image-rendering: pixelated;
      filter: drop-shadow(0 .4vh .6vh rgba(0, 0, 0, .7)) drop-shadow(0 0 1.2vh rgba(255, 190, 80, .25));
      animation: ld-logo 6s ease-in-out infinite;
    }
    @keyframes ld-logo { 50% { filter: drop-shadow(0 .4vh .6vh rgba(0, 0, 0, .7)) drop-shadow(0 0 2.2vh rgba(255, 200, 90, .5)); } }
    #loader.has-logo #ld-title { display: none; }
    #ld-art-bg {
      position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover;
      filter: blur(14px) brightness(.5) saturate(1.1);
    }
    #ld-embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #ld-shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(8, 7, 12, .45) 0%, rgba(8, 7, 12, 0) 26%, rgba(8, 7, 12, 0) 58%, rgba(8, 7, 12, .78) 100%);
    }
    #ld-title {
      position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 6vh); text-align: center;
      font: 400 clamp(34px, 11vh, 96px)/1 "HOGTitle", "Arial Black", system-ui, sans-serif; letter-spacing: .04em;
      color: #ffd66b; text-shadow: 0 .06em 0 #6b3a0c, 0 .1em .25em rgba(0, 0, 0, .7), 0 0 .5em rgba(255, 190, 70, .35);
      animation: ld-glow 5s ease-in-out infinite;
    }
    @keyframes ld-glow { 50% { text-shadow: 0 .06em 0 #6b3a0c, 0 .1em .25em rgba(0, 0, 0, .7), 0 0 .9em rgba(255, 200, 90, .6); } }
    #ld-bottom {
      position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
      display: flex; flex-direction: column; align-items: center; gap: 1.6vh;
    }
    #bar {
      width: min(56vw, 440px); height: 12px; border-radius: 7px; overflow: hidden; box-sizing: border-box;
      background: rgba(10, 10, 18, .7); border: 1px solid rgba(255, 220, 140, .45); box-shadow: 0 0 14px rgba(255, 190, 70, .25);
    }
    #fill {
      width: 0; height: 100%; transition: width .2s;
      background: linear-gradient(90deg, #b8741c, #ffd66b 60%, #fff3c4); box-shadow: 0 0 10px #ffcf5a;
    }
    #status { font-size: 13px; letter-spacing: .06em; color: rgba(240, 232, 214, .75); text-shadow: 0 1px 2px #000; }
    #ld-tap {
      display: none; font: 400 clamp(20px, 5.4vh, 40px)/1 "HOGTitle", "Arial Black", system-ui, sans-serif;
      letter-spacing: .08em; color: #fff7e0; text-shadow: 0 0 .35em #ffbf3f, 0 0 1em rgba(255, 170, 40, .6), 0 2px 2px #000;
      animation: ld-flicker 2.2s linear infinite;
    }
    #loader.ready #ld-tap { display: block; }
    #loader.ready #bar, #loader.ready #status { display: none; }
    /* A candle's flicker: a slow breath with a few quick dips. */
    @keyframes ld-flicker {
      0%, 100% { opacity: 1; } 38% { opacity: .55; } 41% { opacity: .95; } 43% { opacity: .3; } 46% { opacity: 1; }
      70% { opacity: .7; } 72% { opacity: 1; } 86% { opacity: .5; }
    }
    #err { display: none; color: #ff8a80; max-width: 86vw; text-align: center; white-space: pre-wrap; font-size: 13px; text-shadow: 0 1px 2px #000; }
    #rotate {
      position: fixed; inset: 0; display: none; z-index: 10;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      background: #101018; color: #f2c14e; font: 18px system-ui, sans-serif; text-align: center;
    }
    #rotate .icon { font-size: 54px; }

    /* Screenshot button, beside the game's DEV button: the game's UI is laid out on a 600-unit-high canvas, so
       1 unit = 1/6 vh (DEV: 20 units from the safe corner, 72x44). */
    #shot {
      position: fixed; z-index: 5; display: none; box-sizing: border-box;
      left: calc(env(safe-area-inset-left, 0px) + 17.4vh); bottom: calc(env(safe-area-inset-bottom, 0px) + 3.33vh);
      width: 7.33vh; height: 7.33vh; min-width: 30px; min-height: 30px; padding: 0;
      align-items: center; justify-content: center;
      background: #22253a; border: 1px solid #4a4e6c; border-radius: 6px; opacity: .8;
      color: #f2c14e; touch-action: manipulation;
    }
    #shot svg { width: 62%; height: 62%; }
    #shot:active { opacity: 1; background: #2e3250; }
    #flash { position: fixed; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
    #toast {
      position: fixed; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14vh); transform: translateX(-50%);
      padding: 8px 14px; border-radius: 8px; background: rgba(16, 16, 24, .88); color: #e9ebf5;
      font: 14px system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    @media (orientation: portrait) { #rotate { display: flex; } }

    /* Save export / import dialog (dev insurance against the browser evicting site data). */
    #savebox {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      background: rgba(8, 8, 14, 0.78); color: #e9ebf5; font: 15px system-ui, sans-serif;
    }
    #savebox.open { display: flex; }
    #savebox .panel {
      box-sizing: border-box; width: min(92vw, 640px); max-height: 92dvh; overflow: auto;
      display: flex; flex-direction: column; gap: 10px; padding: 16px 18px;
      background: #1c1e2b; border: 1px solid #3a3d52; border-radius: 10px;
    }
    #savebox .title { font-size: 18px; color: #f2c14e; }
    #savebox .hint { font-size: 13px; opacity: .75; }
    #savebox textarea {
      box-sizing: border-box; width: 100%; height: 28dvh; min-height: 70px; resize: none;
      background: #101018; color: #e9ebf5; border: 1px solid #3a3d52; border-radius: 6px;
      font: 12px ui-monospace, monospace; padding: 8px; word-break: break-all;
      -webkit-user-select: text; user-select: text; touch-action: auto;
    }
    #savebox .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    #savebox button {
      min-width: 96px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0;
      background: #2c2f44; color: #ffdb8c; font: 600 15px system-ui, sans-serif;
    }
    #savebox button.primary { background: #f2c14e; color: #1a1408; }
    #savebox .msg { min-height: 1.2em; font-size: 13px; color: #9fe6a0; }
    #savebox .msg.bad { color: #ff8a80; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="sa-probe"></div>
  <div id="loader">
    <img id="ld-art-bg" src="title.png" alt="">
    <img id="ld-art" src="title.png" alt="">
    <canvas id="ld-embers"></canvas>
    <div id="ld-shade"></div>
    <div id="ld-bottom">
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Checking for the latest build…</div>
      <div id="ld-tap">TAP ANYWHERE TO START</div>
      <div id="err"></div>
    </div>
  </div>
  <div id="rotate"><div class="icon">&#x21bb;</div><div>Rotate your phone to landscape</div></div>
  <button id="shot" aria-label="Save a screenshot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
    </svg>
  </button>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="savebox" role="dialog" aria-modal="true" aria-labelledby="sb-title">
    <div class="panel">
      <div class="title" id="sb-title"></div>
      <div class="hint" id="sb-hint"></div>
      <textarea id="sb-text" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="row">
        <button id="sb-paste">Paste</button>
        <button id="sb-copy" class="primary">Copy</button>
        <button id="sb-load" class="primary">Load</button>
        <button id="sb-close">Close</button>
      </div>
      <div class="msg" id="sb-msg"></div>
    </div>
  </div>
  <script>
  // Playtest analytics: the Google Apps Script web app that adds the game's events to the "Hand of God plays" sheet
  // (tools/analytics/playtest_sheet.gs). Empty: nothing is sent.
  window.HOG_ANALYTICS_URL = '';
  (function () {
    var canvas = document.getElementById('unity-canvas');
    var loader = document.getElementById('loader');
    var fill = document.getElementById('fill');
    var status = document.getElementById('status');
    var err = document.getElementById('err');
    var q = new URLSearchParams(location.search);

    // No scrolling, zooming, text selection or long-press menus anywhere on the page, except inside the save dialog.
    function block(e) {
      if (e.target && e.target.closest && e.target.closest('#savebox')) return;
      e.preventDefault();
    }
    ['touchmove', 'gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart']
      .forEach(function (t) { document.addEventListener(t, block, { passive: false }); });

    // Embers rising over the title art: a few dozen soft gold sparks, slow, each on its own path and timing.
    var emb = document.getElementById('ld-embers'), ectx = emb.getContext('2d'), sparks = [], emberRun = true;
    function sizeEmbers() { emb.width = Math.round(innerWidth / 3); emb.height = Math.round(innerHeight / 3); }
    sizeEmbers();
    window.addEventListener('resize', sizeEmbers);
    function spark(fresh) {
      return { x: Math.random() * emb.width, y: fresh ? Math.random() * emb.height : emb.height + 4,
               v: 3 + Math.random() * 9, s: Math.random() < .2 ? 2 : 1, w: Math.random() * 6.28, a: .35 + Math.random() * .6 };
    }
    for (var i = 0; i < 46; i++) sparks.push(spark(true));
    var lastT = performance.now();
    function drawEmbers(t) {
      if (!emberRun) return;
      var dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
      ectx.clearRect(0, 0, emb.width, emb.height);
      for (var k = 0; k < sparks.length; k++) {
        var p = sparks[k];
        p.y -= p.v * dt; p.w += dt * 1.3; p.x += Math.sin(p.w) * 4 * dt;
        if (p.y < -4) sparks[k] = p = spark(false);
        var fade = Math.min(1, p.y / (emb.height * .5));
        ectx.fillStyle = 'rgba(255,' + (150 + (k * 37) % 90) + ',60,' + (p.a * fade * (.75 + .25 * Math.sin(t / 180 + k))).toFixed(3) + ')';
        ectx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
      }
      requestAnimationFrame(drawEmbers);
    }
    requestAnimationFrame(drawEmbers);

    // Ready: the bar gives way to the flickering prompt; a tap (or a key) fades the screen out and the game begins.
    var started = false;
    function begin(e) {
      if (started || !loader.classList.contains('ready')) return;
      started = true;
      loader.classList.add('gone');
      setTimeout(function () { loader.style.display = 'none'; emberRun = false; }, 750);
      window.hogShowShotButton();
    }
    loader.addEventListener('pointerup', begin);
    window.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') begin(e); });
    function gameReady() {
      loader.classList.add('ready');
      if (q.get('tap') === '0') begin();
    }

    function fail(msg) {
      err.style.display = 'block';
      err.textContent = String(msg);
      status.textContent = 'Failed to load';
      console.error('[HOG]', msg);
    }

    // Safe area: env(safe-area-inset-*) in CSS pixels, handed to the game as fractions of the canvas size.
    // ?safe=left,top,right,bottom (CSS px) fakes insets for testing on a desktop.
    var probe = document.getElementById('sa-probe');
    var fakeSafe = (q.get('safe') || '').split(',').map(parseFloat);
    if (fakeSafe.length !== 4 || !fakeSafe.every(isFinite)) fakeSafe = null;
    function measureSafe() {
      var cs = getComputedStyle(probe);
      var px = fakeSafe || [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom].map(function (v) { return parseFloat(v) || 0; });
      var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
      window.hogSafe = { l: px[0] / w, t: px[1] / h, r: px[2] / w, b: px[3] / h, px: px };
    }
    measureSafe();
    window.addEventListener('resize', measureSafe);
    window.addEventListener('orientationchange', function () { setTimeout(measureSafe, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', measureSafe);

    // Full screen in the browser: browsers allow it only from a tap, so every touch tap while the page isn't full
    // screen asks for it (after leaving with the back gesture, the next tap goes back in), then locks landscape.
    // Mouse clicks never do (desktop keeps F11). Installed to the home screen, the manifest already opens full screen.
    // iPhone Safari has no full-screen API: there, Share > Add to Home Screen gives the same. ?fs=0 turns it off.
    var docEl = document.documentElement;
    var fsRequest = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function installed() {
      return navigator.standalone === true ||
        (window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
    }
    function lockLandscape() {
      try { var o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(function () {}); } catch (e) {}
    }
    function goFullscreen(e) {
      if (e.pointerType === 'mouse' || isFullscreen() || installed()) return;
      try {
        var p = fsRequest.call(docEl, { navigationUI: 'hide' });
        if (p && p.then) p.then(lockLandscape, function () {}); else lockLandscape();
      } catch (err) {}
    }
    if (fsRequest && q.get('fs') !== '0') window.addEventListener('pointerup', goFullscreen, true);
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (t) {
      document.addEventListener(t, function () { setTimeout(measureSafe, 250); });
    });

    // Screenshots: full screen hides the phone's own screenshot shortcuts, so the camera button saves the game's
    // picture as a PNG (to Downloads, which the gallery shows). The capture runs on the next animation frame, right
    // after the game has drawn it and before the browser clears it. ?shot=0 hides the button.
    var shotBtn = document.getElementById('shot');
    var flashEl = document.getElementById('flash'), toastEl = document.getElementById('toast');
    var toastTimer = 0;
    function toast(text) {
      toastEl.textContent = text;
      toastEl.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; }, 2200);
    }
    function saveShot(blob) {
      var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
      var name = 'hand-of-god-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' +
        z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + '.png';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      flashEl.style.transition = 'none'; flashEl.style.opacity = '.7';
      requestAnimationFrame(function () { flashEl.style.transition = ''; flashEl.style.opacity = '0'; });
      toast('Screenshot saved');
    }
    shotBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      requestAnimationFrame(function () {
        try {
          canvas.toBlob(function (blob) { if (blob) saveShot(blob); else toast('Could not take the screenshot'); }, 'image/png');
        } catch (err) { toast('Could not take the screenshot'); }
      });
    });
    window.hogShowShotButton = function () { if (q.get('shot') !== '0') shotBtn.style.display = 'flex'; };

    // Ask the browser not to evict our storage. Chrome grants or refuses silently (installed apps usually get it).
    window.hogStorageMode = 'unknown';
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted()
        .then(function (p) { return p || navigator.storage.persist(); })
        .then(function (p) { window.hogStorageMode = p ? 'persistent' : 'best-effort'; })
        .catch(function () {});
    }

    // Save export / import dialog. The game calls hogSaveExport(text) and hogSaveImport(callback).
    var box = document.getElementById('savebox');
    var sbTitle = document.getElementById('sb-title'), sbHint = document.getElementById('sb-hint');
    var sbText = document.getElementById('sb-text'), sbMsg = document.getElementById('sb-msg');
    var sbPaste = document.getElementById('sb-paste'), sbCopy = document.getElementById('sb-copy');
    var sbLoad = document.getElementById('sb-load'), sbClose = document.getElementById('sb-close');
    var importCb = null;
    function msg(text, bad) { sbMsg.textContent = text || ''; sbMsg.className = bad ? 'msg bad' : 'msg'; }
    function openBox(isImport) {
      sbPaste.style.display = isImport ? '' : 'none';
      sbLoad.style.display = isImport ? '' : 'none';
      sbCopy.style.display = isImport ? 'none' : '';
      sbText.readOnly = !isImport;
      msg('');
      box.classList.add('open');
    }
    function closeBox() { box.classList.remove('open'); importCb = null; sbText.value = ''; sbText.blur(); }
    window.hogSaveExport = function (text) {
      importCb = null;
      sbTitle.textContent = 'Export save';
      sbHint.textContent = 'Copy this text and keep it somewhere safe (notes, a message to yourself). Import pastes it back.';
      sbText.value = text;
      openBox(false);
    };
    window.hogSaveImport = function (cb) {
      sbTitle.textContent = 'Import save';
      sbHint.textContent = 'Paste an exported save, then Load. This replaces your current progress and restarts the game.';
      sbText.value = '';
      openBox(true);
      importCb = cb;
    };
    sbCopy.addEventListener('click', function () {
      var text = sbText.value;
      function fallback() {
        sbText.focus(); sbText.select(); sbText.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        msg(ok ? 'Copied.' : 'Could not copy automatically. Select the text and copy it by hand.', !ok);
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { msg('Copied.'); }, fallback);
      } else fallback();
    });
    sbPaste.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) {
        navigator.clipboard.readText().then(function (t) { sbText.value = t; msg(''); },
          function () { msg('Paste was blocked. Long-press the box and choose Paste.', true); });
      } else msg('Long-press the box and choose Paste.', true);
    });
    // The game answers synchronously: on success it reloads the page, otherwise it calls hogSaveImportFailed.
    window.hogSaveImportFailed = function (text) { msg(text, true); };
    sbLoad.addEventListener('click', function () {
      var text = sbText.value.trim();
      if (!text) { msg('The box is empty.', true); return; }
      if (text.indexOf('HOG1:') !== 0) { msg('That is not a Hand of God save (it should start with HOG1:).', true); return; }
      if (!importCb) { msg('The game is not ready for an import. Close this and press Import again.', true); return; }
      msg('Loading…');
      importCb(text);
    });
    sbClose.addEventListener('click', closeBox);

    // Render resolution cap. Phones report devicePixelRatio ~3; 2 keeps fill-rate sane. Override with ?dpr=1.5
    var dprCap = parseFloat(q.get('dpr')) || 2;
    var dpr = Math.min(window.devicePixelRatio || 1, dprCap);

    // Load phase timings (ms since navigation start), shown in the game HUD.
    var T = window.hogT = { page: performance.now() };
    function mark(k) { if (T[k] === undefined) T[k] = performance.now(); }
    window.hogOnFirstFrame = function (ms) {
      T.first = ms;
      console.log('[HOG] load timings (s): ' + JSON.stringify(Object.fromEntries(
        Object.entries(T).map(function (e) { return [e[0], +(e[1] / 1000).toFixed(2)]; }))));
    };

    // build.json is fetched fresh on every load and names the hashed build files,
    // so a cached copy of this page can never start an old build.
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('build.json: HTTP ' + r.status); return r.json(); })
      .then(function (b) {
        mark('json');
        window.hogBuild = b;
        status.textContent = 'Loading build ' + b.version;
        var s = document.createElement('script');
        s.src = 'Build/' + b.loader;
        s.onerror = function () { fail('Could not load Build/' + b.loader); };
        s.onload = function () {
          mark('loader');
          createUnityInstance(canvas, {
            dataUrl: 'Build/' + b.data,
            frameworkUrl: 'Build/' + b.framework,
            codeUrl: 'Build/' + b.code,
            streamingAssetsUrl: 'StreamingAssets',
            companyName: "HandOfGod",
            productName: "Hand of God",
            productVersion: b.version,
            devicePixelRatio: dpr,
            matchWebGLToCanvasSize: true,
            showBanner: function (msg, type) {
              if (type === 'error') fail(msg); else console.warn('[HOG] ' + msg);
            }
          }, function (p) {
            fill.style.width = Math.round(p * 100) + '%';
            status.textContent = p < 0.9 ? 'Loading ' + Math.round(p / 0.9 * 100) + '%' : 'Waking the gods…';
            if (p >= 0.9) mark('fetched');  // Unity reports 0.9 once all files are downloaded and decompressed
          }).then(function (instance) {
            mark('ready');
            window.hogUnity = instance;
            gameReady();
          }).catch(fail);
        };
        document.body.appendChild(s);
      })
      .catch(fail);
  })();
  </script>
</body>
</html>
